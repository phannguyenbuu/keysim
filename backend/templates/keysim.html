<!doctype html>
<html lang="en">
{% include "header.html" %}
<body>
  <div class="container">
    <div class="header">
      <h1>🎨 Colorway Editor</h1>
    </div>
    
    <div class="tabs">
      {% for t,f in files.items() %}
      <button class="tab-btn {% if t==tab %}active{% endif %}" onclick="switchTab('{{t}}')">
        {{ t.upper() }}
      </button>
      {% endfor %}
    </div>

    {% for t,f in files.items() %}
    <div id="{{t}}-tab" class="tab-content {% if t==tab %}active{% endif %}">
      <div class="content-header">
        <div class="content-title">{{ t.upper() }} Colors</div>
        <button class="save-btn" onclick="saveTable('{{t}}')">Save</button>
      </div>
      
      <div class="table-container">
        <table id="{{t}}-table">
          <thead>
            <tr>
              <th>Key</th>
              <th>Fill</th>
              <th>Text</th>
            </tr>
          </thead>
          <tbody>
            {% if t==tab %}
              {% for k,c in items %}
              <tr>
                  <td>
                    <input type="text"
                          class="key-input"
                          value="{{k}}"
                          data-old-key="{{k}}">
                  </td>

                  <!-- Background color -->
                  <td>
                    <div style="display:flex; gap:12px; align-items:center;">
                      <input type="text"
                            class="color-text bg-text"
                            value="{{c.bg}}"
                            placeholder="#rrggbb">

                      <input type="color"
                            class="color-picker bg-picker"
                            value="{{c.bg}}">
                    </div>
                  </td>

                  <!-- Text color -->
                  <td>
                    <div style="display:flex; gap:12px; align-items:center;">
                      <input type="text"
                            class="color-text text-text"
                            value="{{c.text}}"
                            placeholder="#rrggbb">

                      <input type="color"
                            class="color-picker text-picker"
                            value="{{c.text}}">
                    </div>
                  </td>
                </tr>

              {% endfor %}
            {% endif %}
          </tbody>
        </table>
      </div>
    </div>
    {% endfor %}
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content, .tab-btn').forEach(el=>el.classList.remove('active'));
      document.getElementById(tab+'-tab').classList.add('active');
      event.target.classList.add('active');
      window.location.href = '/' + tab;
    }
    
    function initColorSync(tableId) {
      const table = document.getElementById(tableId);

      table.querySelectorAll('.color-picker').forEach(picker => {
        picker.oninput = e => {
          const row = e.target.closest('td');
          const text = row.querySelector('.color-text');
          text.value = e.target.value;
        };
      });

      table.querySelectorAll('.color-text').forEach(text => {
        text.onchange = e => {
          if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) {
            const row = e.target.closest('td');
            const picker = row.querySelector('.color-picker');
            picker.value = e.target.value;
          }
        };
      });
    }

    
    // Init sync cho tab hiện tại
    initColorSync('{{tab}}-table');
    
    function saveTable(tab) {
      const table = document.getElementById(tab+'-table');

      const items = Array.from(table.querySelectorAll('tbody tr')).map(row => ({
        old_key: row.querySelector('.key-input').dataset.oldKey,
        new_key: row.querySelector('.key-input').value.trim(),
        bg_color: row.querySelector('.bg-text').value.trim(),
        text_color: row.querySelector('.text-text').value.trim(),
      }));

      fetch(`/api/${tab}/go`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ items })
      })
      .then(r => r.json())
      .then(d => {
        if (d.status === 'ok') {
          alert(`✅ Đã lưu ${tab.toUpperCase()} thành công!`);
          location.reload();
        } else {
          alert(`❌ Lỗi: ${d.error || 'Unknown error'}`);
        }
      });
    }

  </script>
</body>
</html>
